[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiraoku-software-garden"
version = "0.1.0"
description = "Nursery CLI and deterministic verification core for Software Garden."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
garden = "garden.cli:main"

[tool.setuptools]
# templates/ と harnesses/ をパッケージに同梱し、uvx / pipx run でクローンせずに使えるようにする
packages = [
  "garden",
  "garden.adapters",
  "garden._nursery.templates",
  "garden._nursery.harnesses",
]

[tool.setuptools.package-dir]
"" = "src"
"garden._nursery.templates" = "templates"
"garden._nursery.harnesses" = "harnesses"

[tool.setuptools.package-data]
"garden._nursery.templates" = ["**/*"]
"garden._nursery.harnesses" = ["*.toml"]
