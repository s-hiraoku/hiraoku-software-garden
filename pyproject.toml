[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiraoku-software-garden"
version = "0.1.0"
description = "Nursery CLI and deterministic verification core for Software Garden."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
garden = "garden.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
