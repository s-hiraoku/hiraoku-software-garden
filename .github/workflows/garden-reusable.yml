name: Garden Reusable Verification Workflow

on:
  workflow_call:
    inputs:
      flow:
        description: "Garden flow name defined in .garden/garden.toml (or 'auto' to resolve via [[triggers]])"
        required: true
        type: string
      approval_branch:
        description: "Trusted approval branch name for Trust Anchor verification"
        required: false
        type: string
        default: "main"
      issue_number:
        description: "Issue or PR number for reporting, duplicate-marker check, and label transitions (0 to skip)"
        required: false
        type: number
        default: 0
      force:
        description: "Force re-execution even if an identical SATISFIED run exists"
        required: false
        type: boolean
        default: false
      nursery_ref:
        description: "Git ref of hiraoku-software-garden to use for the CLI"
        required: false
        type: string
        default: "main"

concurrency:
  group: garden-${{ inputs.flow }}-${{ github.ref }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  run-garden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR head on issue_comment resume
        if: github.event_name == 'issue_comment' && inputs.issue_number != 0
        env:
          ISSUE_NUM: ${{ inputs.issue_number }}
        run: |
          if git fetch origin "pull/${ISSUE_NUM}/head:garden-pr-head" 2>/dev/null; then
            git checkout garden-pr-head
          fi

      - name: Fetch trusted approval branch
        env:
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
        run: git fetch origin "${APPROVAL_BRANCH}:refs/remotes/origin/${APPROVAL_BRANCH}" || true

      - name: Clone Nursery CLI outside target checkout
        env:
          NURSERY_REF: ${{ inputs.nursery_ref }}
        run: |
          rm -rf "${RUNNER_TEMP}/garden-nursery"
          git clone --depth 1 --branch "${NURSERY_REF}" \
            https://github.com/s-hiraoku/hiraoku-software-garden.git \
            "${RUNNER_TEMP}/garden-nursery"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Garden flow
        id: garden_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_NAME: ${{ inputs.flow }}
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
          FORCE_RUN: ${{ inputs.force }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          TRIGGER_ACTION: ${{ github.event.action }}
        run: |
          set +e
          LAST_RUN_JSON="${RUNNER_TEMP}/garden-last-run.json"
          ARGS=(
            python3 "${RUNNER_TEMP}/garden-nursery/garden.py" run "${FLOW_NAME}"
            --target .
            --approval-branch "${APPROVAL_BRANCH}"
            --trigger-event "${GITHUB_EVENT_NAME}"
            --trigger-id "${GITHUB_WORKFLOW}"
            --json
          )
          if [ -n "${TRIGGER_ACTION}" ]; then
            ARGS+=(--trigger-action "${TRIGGER_ACTION}")
          fi
          if [ "${ISSUE_NUM}" != "0" ] && [ -n "${ISSUE_NUM}" ]; then
            ARGS+=(--issue "${ISSUE_NUM}" --check-github-markers)
          fi
          if [ "${FORCE_RUN}" = "true" ]; then
            ARGS+=(--force)
          fi
          "${ARGS[@]}" > "${LAST_RUN_JSON}"
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"
          python3 - "${LAST_RUN_JSON}" "${GITHUB_OUTPUT}" <<'PY'
import json, pathlib, sys
src, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
try:
    d = json.loads(src.read_text(encoding="utf-8"))
    run_dir = d.get("run_dir") or ""
    skipped = "true" if d.get("skipped_duplicate") else "false"
except Exception:
    run_dir, skipped = "", "false"
with out.open("a", encoding="utf-8") as fh:
    fh.write(f"run_dir={run_dir}\n")
    fh.write(f"skipped_duplicate={skipped}\n")
PY
          exit "${EXIT_CODE}"

      - name: Upload Run Artifacts
        if: always() && steps.garden_run.outputs.run_dir != '' && steps.garden_run.outputs.skipped_duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: garden-run-${{ inputs.flow }}-${{ github.run_id }}
          path: ${{ steps.garden_run.outputs.run_dir }}

      - name: Post report to GitHub Issue / PR
        if: always() && inputs.issue_number != 0 && steps.garden_run.outputs.run_dir != '' && steps.garden_run.outputs.skipped_duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "${RUNNER_TEMP}/garden-nursery/garden.py" report \
            "${{ steps.garden_run.outputs.run_dir }}" \
            --post-github-issue "${{ inputs.issue_number }}"

      - name: Propagate deterministic verdict exit code
        if: always()
        run: exit "${{ steps.garden_run.outputs.exit_code }}"
