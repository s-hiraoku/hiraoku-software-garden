name: Garden Reusable Verification Workflow

on:
  workflow_call:
    inputs:
      flow:
        description: "Garden flow name defined in .garden/garden.toml (or 'auto' to resolve via [[triggers]])"
        required: true
        type: string
      approval_branch:
        description: "Trusted approval branch name for Trust Anchor verification"
        required: false
        type: string
        default: "main"
      issue_number:
        description: "Issue or PR number for reporting, duplicate-marker check, and label transitions (0 to skip)"
        required: false
        type: number
        default: 0
      force:
        description: "Force re-execution even if an identical SATISFIED run exists"
        required: false
        type: boolean
        default: false
      nursery_ref:
        description: "Git ref of hiraoku-software-garden to use for the CLI"
        required: false
        type: string
        default: "main"
      reflect:
        description: "Execute Phase-6 reflection gate (garden reflect --execute) when verdict is SATISFIED (requires caller permissions contents:write, pull-requests:write, repo PR creation setting, and target_commit on base_branch)"
        required: false
        type: boolean
        default: false
      base_branch:
        description: "Base branch for Phase-6 reflection PR creation"
        required: false
        type: string
        default: "main"
      node_version:
        description: "Optional Node.js version spec (e.g. '24') when the target repository does not provide a version file"
        required: false
        type: string
        default: ""
      node_version_file:
        description: "Optional path (in the target checkout) to a Node.js version file such as .node-version or .nvmrc; when set alongside or instead of node_version, Node.js and package.json packageManager (npm@<version> or pnpm@<version>) are installed before checks run"
        required: false
        type: string
        default: ""
      sync_pstack:
        description: "Synchronize pinned pstack skills into the active adapter skill directory (verified against approved [common_harness].ref) before running the Garden flow"
        required: false
        type: boolean
        default: false
    secrets:
      reflect_token:
        description: "Optional GitHub App token / PAT for Phase-6 reflect push, PR creation, and auto-merge (default GITHUB_TOKEN cannot trigger downstream required workflows on PRs it opens)"
        required: false
      nursery_token:
        description: "Optional read token for fetching a private Nursery repository"
        required: false

jobs:
  run-garden:
    runs-on: ubuntu-latest
    concurrency:
      group: garden-${{ github.repository }}-${{ inputs.issue_number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.reflect_token || github.token }}

      - name: Authorize and checkout PR head on issue_comment resume
        if: github.event_name == 'issue_comment'
        env:
          ISSUE_NUM: ${{ inputs.issue_number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          AUTHOR_ASSOC: ${{ github.event.comment.author_association }}
        run: |
          if [ "${IS_PR}" != "true" ] || [ "${ISSUE_NUM}" = "0" ] || [ -z "${ISSUE_NUM}" ]; then
            echo "error: /garden resume is only supported on pull requests" >&2
            exit 1
          fi
          case "${AUTHOR_ASSOC}" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              echo "error: unauthorized commenter association '${AUTHOR_ASSOC}' for /garden resume" >&2
              exit 1
              ;;
          esac
          git fetch origin "pull/${ISSUE_NUM}/head:garden-pr-head"
          git checkout garden-pr-head

      - name: Fetch trusted approval branch
        env:
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
        run: git fetch origin "${APPROVAL_BRANCH}:refs/remotes/origin/${APPROVAL_BRANCH}" || true

      - name: Clone Nursery CLI outside target checkout
        env:
          NURSERY_REF: ${{ inputs.nursery_ref }}
          NURSERY_TOKEN: ${{ secrets.nursery_token }}
        run: |
          NURSERY_DIR="${RUNNER_TEMP}/garden-nursery"
          rm -rf "${NURSERY_DIR}"
          mkdir -p "${NURSERY_DIR}"
          git -C "${NURSERY_DIR}" init -q
          if [ -n "${NURSERY_TOKEN}" ]; then
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${NURSERY_TOKEN}" | base64 | tr -d '\n')"
            git -C "${NURSERY_DIR}" -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
              fetch --depth 1 https://github.com/s-hiraoku/hiraoku-software-garden.git "${NURSERY_REF}"
          else
            git -C "${NURSERY_DIR}" fetch --depth 1 \
              https://github.com/s-hiraoku/hiraoku-software-garden.git "${NURSERY_REF}"
          fi
          git -C "${NURSERY_DIR}" checkout -q FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for target checks
        if: inputs.node_version != '' || inputs.node_version_file != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install pinned package manager for target checks
        if: inputs.node_version != '' || inputs.node_version_file != ''
        run: |
          PM="$(node -p 'try { require("./package.json").packageManager || "" } catch { "" }')"
          case "${PM}" in
            npm@*|pnpm@*) npm install --global "${PM}" ;;
            *) echo "no npm/pnpm packageManager pin; using bundled toolchain" ;;
          esac

      - name: Sync pinned pstack common harness
        if: inputs.sync_pstack
        env:
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
          FLOW_NAME: ${{ inputs.flow }}
          TRIGGER_ACTION: ${{ github.event.action }}
        run: |
          SYNC_ARGS=(
            python3 "${RUNNER_TEMP}/garden-nursery/garden.py" harness sync-pstack
            --adapter auto
            --target .
            --approval-branch "${APPROVAL_BRANCH}"
            --flow "${FLOW_NAME}"
            --trigger-event "${GITHUB_EVENT_NAME}"
            --apply
            --json
          )
          if [ -n "${TRIGGER_ACTION}" ]; then
            SYNC_ARGS+=(--trigger-action "${TRIGGER_ACTION}")
          fi
          "${SYNC_ARGS[@]}"

      - name: Mark Issue / PR as garden:running
        if: inputs.issue_number != 0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "${RUNNER_TEMP}/garden-nursery/garden.py" report \
            --mark-running "${{ inputs.issue_number }}"

      - name: Run Garden flow
        id: garden_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_NAME: ${{ inputs.flow }}
          APPROVAL_BRANCH: ${{ inputs.approval_branch }}
          FORCE_RUN: ${{ inputs.force }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          TRIGGER_ACTION: ${{ github.event.action }}
        run: |
          set +e
          LAST_RUN_JSON="${RUNNER_TEMP}/garden-last-run.json"
          ARGS=(
            python3 "${RUNNER_TEMP}/garden-nursery/garden.py" run "${FLOW_NAME}"
            --target .
            --approval-branch "${APPROVAL_BRANCH}"
            --trigger-event "${GITHUB_EVENT_NAME}"
            --trigger-id "${GITHUB_WORKFLOW}"
            --json
          )
          if [ -n "${TRIGGER_ACTION}" ]; then
            ARGS+=(--trigger-action "${TRIGGER_ACTION}")
          fi
          if [ "${ISSUE_NUM}" != "0" ] && [ -n "${ISSUE_NUM}" ]; then
            ARGS+=(--issue "${ISSUE_NUM}" --check-github-markers)
          fi
          if [ "${FORCE_RUN}" = "true" ]; then
            ARGS+=(--force)
          fi
          "${ARGS[@]}" > "${LAST_RUN_JSON}"
          EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"
          python3 - "${LAST_RUN_JSON}" "${GITHUB_OUTPUT}" <<'PY'
          import json, pathlib, sys
          src, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          try:
              d = json.loads(src.read_text(encoding="utf-8"))
              run_dir = d.get("run_dir") or ""
              skipped = "true" if d.get("skipped_duplicate") else "false"
          except Exception:
              run_dir, skipped = "", "false"
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"run_dir={run_dir}\n")
              fh.write(f"skipped_duplicate={skipped}\n")
          PY
          exit "${EXIT_CODE}"

      - name: Upload Run Artifacts
        if: always() && steps.garden_run.outputs.run_dir != '' && steps.garden_run.outputs.skipped_duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: garden-run-${{ inputs.flow }}-${{ github.run_id }}
          path: ${{ steps.garden_run.outputs.run_dir }}

      - name: Post report to GitHub Issue / PR
        if: always() && inputs.issue_number != 0 && steps.garden_run.outputs.run_dir != '' && steps.garden_run.outputs.skipped_duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "${RUNNER_TEMP}/garden-nursery/garden.py" report \
            "${{ steps.garden_run.outputs.run_dir }}" \
            --post-github-issue "${{ inputs.issue_number }}"

      - name: Clear garden:running when report is skipped
        if: always() && inputs.issue_number != 0 && (steps.garden_run.outputs.run_dir == '' || steps.garden_run.outputs.skipped_duplicate == 'true')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "${RUNNER_TEMP}/garden-nursery/garden.py" report \
            --clear-running "${{ inputs.issue_number }}"

      - name: Execute Phase-6 reflection gate
        # Explicit success() ensures reflect only runs when checkout, run, artifact upload, and report succeeded.
        # Note: caller workflows enabling reflect=true need `contents: write` + `pull-requests: write`,
        # repository setting "Allow GitHub Actions to create and approve pull requests", and for
        # protected branches with required status checks a GitHub App token via `secrets.reflect_token`
        # (because PRs opened with default GITHUB_TOKEN do not trigger downstream workflows).
        if: success() && inputs.reflect && steps.garden_run.outputs.exit_code == '0' && steps.garden_run.outputs.run_dir != '' && steps.garden_run.outputs.skipped_duplicate != 'true'
        env:
          GH_TOKEN: ${{ secrets.reflect_token || github.token }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          python3 "${RUNNER_TEMP}/garden-nursery/garden.py" reflect \
            "${{ steps.garden_run.outputs.run_dir }}" \
            --base "${BASE_BRANCH}" \
            --execute

      - name: Propagate deterministic verdict exit code
        if: always()
        run: exit "${{ steps.garden_run.outputs.exit_code }}"
