schema_version = 1
name = "http-api"
version = 1
summary = "HTTP API 向けガーデンテンプレート（正常・不正リクエストの応答とデータ変化を検証）"

[detect]
files_any = ["openapi.yaml", "openapi.yml", "openapi.json", "pyproject.toml", "package.json", "go.mod"]
keywords_any = ["openapi", "fastapi", "\"express\"", "\"hono\"", "flask", "gin-gonic", "axum"]

[common_harness]
name = "pstack"
ref = "7a583913eb1b8d1a0ee76753d1a2cf072e7b54f9"
recommended_skills = ["create-verification-skill", "maintain-verification-skill"]

[standard_harness]
common_required_skills = ["create-verification-skill", "maintain-verification-skill"]
target_required_skills = []
target_required_mcp = []
recommended_checks = ["api_contract", "typecheck", "error_status_and_persistence"]
notes = "HTTP API は実サーバー起動またはテストクライアントで正常・異常ステータスとデータ変化を検証する。"

[defaults.delegation]
mode = "observe_only"
allowed_paths = []
forbidden_paths = [".garden/**", "docs/specs/**", ".github/workflows/**"]
max_retries = 1
max_duration_sec = 600
max_cost_usd = 3.0

[defaults.checks.api_contract]
kind = "check"
command = ["python3", "-c", "print('replace with HTTP API contract check')"]
timeout_sec = 180
covers = ["AC-001"]
inconclusive_exit_codes = [75]
status = "active"
